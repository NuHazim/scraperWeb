<!DOCTYPE html>
<html>
<head>
  <title>Book Scraper</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    input {
      padding: 5px;
      font-size: 14px;
    }

    button {
      padding: 6px 10px;
      cursor: pointer;
    }

    h2 {
      margin-top: 20px;
      color: darkblue;
    }

    ul {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<h1>Book Scraper</h1>

<input id="rangeInput" placeholder="Enter range (e.g. 1-3)">
<button onclick="loadBooks()">Scrape</button>

<div id="bookList"></div>

<script>
async function loadBooks() {
  const range = document.getElementById("rangeInput").value || "1-1";

  const res = await fetch(`/api/books?range=${range}`);
  const data = await res.json();

  console.log("DATA:", data);

  const container = document.getElementById("bookList");
  container.innerHTML = "";

  // Loop pages properly
  Object.keys(data).forEach(page => {
    const title = document.createElement("h2");
    title.textContent = page;
    container.appendChild(title);

    const ul = document.createElement("ul");

    data[page].forEach(book => {
      const li = document.createElement("li");
      li.textContent = book;
      ul.appendChild(li);
    });

    container.appendChild(ul);
  });
}
</script>

</body>
</html>
